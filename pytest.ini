[pytest]
testpaths = tests
asyncio_mode = auto
# 默认 function scope 会让每个 async 测试各起一个 event loop，
# 而 src.infra.db 的 engine 是模块级单例、绑定在首个 loop 上 —— 第二个测试必炸。
asyncio_default_fixture_loop_scope = session

markers =
    integration: 需要真实外部服务（docker compose 全套 + 种子数据），CI 默认跳过

# 默认只跑单测；本地全量：pytest -m "" ；仅集成：pytest -m integration
addopts = -m "not integration"

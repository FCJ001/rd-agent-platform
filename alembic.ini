# ============================================================
# Alembic 配置
#
# ★ 只有两处与默认模板不同，都很关键：
#   ① prepend_sys_path = .   —— 否则 env.py 里 import src.* 会 ModuleNotFoundError
#   ② sqlalchemy.url 留空     —— 密码不进 git，由 env.py 从 Settings 注入，单一来源
#
# 常用命令（在项目根目录执行）：
#   alembic revision --autogenerate -m "xxx"   生成迁移（★ 生成后必须人工审 diff）
#   alembic upgrade head                       升到最新
#   alembic upgrade head --sql                 只打印 SQL 不执行（审查用）
#   alembic current / history --verbose        当前版本 / 历史
#   alembic downgrade -1                       回退一个版本
# ============================================================

[alembic]
script_location = %(here)s/alembic

# ★ 把项目根目录加入 sys.path
prepend_sys_path = .

path_separator = os

# ★ 留空！由 env.py 里 config.set_main_option("sqlalchemy.url", settings.DATABASE_URL) 注入
#   1. 本文件进 git，写密码就泄露
#   2. 连接串的唯一事实来源是 .env → Settings，不分叉
sqlalchemy.url =


[post_write_hooks]


# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

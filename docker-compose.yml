# ============================================================
# rd-agent-platform — 基础设施层
# 包含：PostgreSQL / Redis Stack / Neo4j / Milvus(+etcd, MinIO)
#
# 结构照搬 tiangong-agent 的 docker-compose.yml，只改了两处：
#   ① 容器名 / 网络名换成 rd-agent-*
#   ② 账号密码换成 rdagent / rd_agent
# 端口与医疗版一致 —— 两个项目不同时跑，跑之前先 docker compose down 另一个
#
# 启动：docker compose up -d
# 停止：docker compose down
# 清数据：docker compose down -v      ← 注意会删库
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — 结构化数据库
  # 存储：ALM 镜像表 / 诊断知识主数据 / AI 影子表 / users
  # ----------------------------------------------------------
  postgres:
    image: postgres:17.9
    container_name: rd-agent-postgres
    restart: always
    environment:
      POSTGRES_USER: rdagent
      POSTGRES_PASSWORD: rdagent123
      # ★ POSTGRES_DB 只在数据卷为空时生效。
      #   改了库名发现没生效，多半是卷里已有数据 —— 要 down -v 才会重建
      POSTGRES_DB: rd_agent
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rd-agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdagent -d rd_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis Stack — 短期记忆 + 分诊状态机 checkpoint
  # 必须用 redis-stack 而不是标准 redis：
  #   langgraph-checkpoint-redis 依赖 JSON.SET（RedisJSON 模块）
  #   AsyncRedisSaver 还要建 RediSearch 索引
  # Web UI（RedisInsight）：http://localhost:8001
  # ----------------------------------------------------------
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: rd-agent-redis
    restart: always
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - ./docker/redis_data:/data
    ports:
      - "6379:6379"   # Redis 主端口
      - "8001:8001"   # RedisInsight 可视化 Web UI
    networks:
      - rd-agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Neo4j — 图数据库
  # 存储：追溯图谱（现象码-根因-责任域-配置项-变更-基线，7 类关系）
  # 「冻结基线阻塞哪些在途需求」这条五跳查询靠它
  # Web UI：http://localhost:7474   neo4j / rdagent123
  # ----------------------------------------------------------
  neo4j:
    image: neo4j:5.20
    container_name: rd-agent-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/rdagent123
      NEO4J_PLUGINS: '["apoc"]'                  # APOC 插件，支持高级图算法
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - ./docker/neo4j_data:/data
      - ./docker/neo4j_logs:/logs
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt 协议（SDK 连接）
    networks:
      - rd-agent-net
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # Milvus 依赖：etcd — 元数据存储
  # 不暴露宿主机端口，只在 compose 网络内被 milvus 访问
  # ----------------------------------------------------------
  etcd:
    container_name: rd-agent-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ./docker/etcd_data:/etcd
    networks:
      - rd-agent-net

  # ----------------------------------------------------------
  # MinIO — 对象存储
  # 双重用途：① Milvus 的向量数据文件后端
  #           ② 报告/日志附件（台架、绝缘、SOH 报告原件）
  # Console：http://localhost:9001
  # ----------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rd-agent-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./docker/minio_data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rd-agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------------------------
  # Milvus — 向量数据库
  # 存储：现象码向量索引（三层标准化的语义兜底）+ 长期记忆 MilvusStore
  # ----------------------------------------------------------
  milvus:
    container_name: rd-agent-milvus
    image: milvusdb/milvus:v2.6.13
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      # ★ 这里写的是【容器内】地址，走 compose 网络的服务名
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./docker/milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC 接口（SDK 连接）
      - "9091:9091"     # HTTP 接口（健康检查）
    depends_on:
      - etcd
      - minio
    networks:
      - rd-agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------------------------
  # Attu — Milvus 可视化客户端
  # http://localhost:3000
  # ----------------------------------------------------------
  attu:
    container_name: rd-agent-attu
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    networks:
      - rd-agent-net
    depends_on:
      - milvus

# ----------------------------------------------------------
# 网络
# ----------------------------------------------------------
networks:
  rd-agent-net:
    driver: bridge
